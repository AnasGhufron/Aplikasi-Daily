<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NEXUS — Personal Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B82F6'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='%230B1120' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="learning.css">
  <link rel="stylesheet" href="finance.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <a class="skip-link" href="#view">Lewati ke konten utama</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span class="brand-text"><strong>NEXUS</strong><small>Personal Command Center</small></span>
      </div>
      <nav id="nav" class="nav"></nav>
      <p class="sidebar-foot" id="storageNote">Data tersimpan di perangkat ini.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false" aria-controls="sidebar">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Ganti tema terang atau gelap">◐</button>
      </header>
      <div class="banner" id="banner" role="status" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi cepat"></nav>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button type="button" class="icon-btn" id="modalClose" aria-label="Tutup jendela">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">NEXUS membutuhkan JavaScript yang aktif di browser.</p></noscript>

  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="curriculum.js"></script>
  <script src="schedule.js"></script>
  <script src="learning.js"></script>
  <script src="tasks.js"></script>
  <script src="finance.js"></script>
  <script src="budget.js"></script>
  <script src="savings.js"></script>
  <script src="habits.js"></script>
  <script src="reports.js"></script>
  <script src="settings.js"></script>
  <script src="dashboard.js"></script>
  <script src="reminders.js"></script>
  <script src="app.js"></script>
</body>
</html>
